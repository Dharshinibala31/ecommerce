<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEase | Shopping Cart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ==========================
     HEADER
========================== -->

<header>

    <nav class="navbar">

        <h1 class="logo">ShopEase</h1>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="products.html">Products</a></li>

            <li><a href="cart.html" class="active">
                Cart
            </a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

</header>

<!-- ==========================
     CART SECTION
========================== -->

<section class="cart-section">

    <h2>🛒 Shopping Cart</h2>

    <div id="cartContainer">

        <!-- Cart items will be loaded here using JavaScript -->

    </div>

    <div class="cart-summary">

        <h3>
            Total: ₹
            <span id="totalPrice">0</span>
        </h3>

        <button id="clearCartBtn" class="btn">
            Clear Cart
        </button>

        <button id="checkoutBtn" class="btn">
            Proceed to Checkout
        </button>

    </div>

</section>

<!-- ==========================
     EMPTY CART MESSAGE
========================== -->

<section id="emptyCart" class="empty-cart">

    <h2>Your cart is empty.</h2>

    <p>

        Browse our products and add your favourite items.

    </p>

    <a href="products.html" class="btn">

        Continue Shopping

    </a>

</section>

<!-- ==========================
     FOOTER
========================== -->

<footer>

    <p>

        © 2026 ShopEase.
        All Rights Reserved.

    </p>

</footer>

<script src="products.js"></script>

<script src="script.js"></script>

</body>

</html>
