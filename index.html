<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Home</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->

    <header>

        <nav class="navbar">

            <h1 class="logo">ShopEase</h1>

            <ul>

                <li><a href="index.html">Home</a></li>

                <li><a href="products.html">Products</a></li>

                <li><a href="cart.html">Cart</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="contact.html">Contact</a></li>

            </ul>

        </nav>

    </header>

    <!-- Hero Section -->

    <section class="hero">

        <div class="hero-content">

            <h2>Welcome to ShopEase</h2>

            <p>

                Discover amazing products at affordable prices.

                Shop anytime, anywhere.

            </p>

            <a href="products.html" class="btn">

                Shop Now

            </a>

        </div>

    </section>

    <!-- Categories -->

    <section class="categories">

        <h2>Categories</h2>

        <div class="category-container">

            <div class="category-card">

                <img src="images/laptop.jpg" alt="Laptop">

                <h3>Laptops</h3>

            </div>

            <div class="category-card">

                <img src="images/mobile.jpg" alt="Mobile">

                <h3>Mobiles</h3>

            </div>

            <div class="category-card">

                <img src="images/watch.jpg" alt="Watch">

                <h3>Watches</h3>

            </div>

            <div class="category-card">

                <img src="images/headphone.jpg" alt="Headphones">

                <h3>Headphones</h3>

            </div>

        </div>

    </section>

    <!-- Featured Products -->

    <section class="featured">

        <h2>Featured Products</h2>

        <div id="featuredProducts" class="product-grid">

            <!-- JavaScript loads products -->

        </div>

    </section>

    <!-- Footer -->

    <footer>

        <p>

            © 2026 ShopEase. All Rights Reserved.

        </p>

    </footer>

    <script src="products.js"></script>

    <script src="script.js"></script>

</body>

</html>
